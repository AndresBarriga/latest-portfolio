<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Translation flow</title>
<desc>Translation flow. Guest-facing products render three content sources: static frontend strings, property configuration and live PMS data. Static strings are translated at build time. Property configuration and PMS data are translated at render time by a model, once per string, and stored in a shared cache keyed on source text, language and context. Guests read from the cache. Staff can flag a translation, which corrects the cache entry. The first uncached render takes around five seconds and is warmed in QA before release.</desc>

<rect x="40" y="24" width="190" height="42" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="135" y="45" dominant-baseline="central" text-anchor="middle" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Static frontend strings</text>

<rect x="40" y="80" width="190" height="42" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="135" y="101" dominant-baseline="central" text-anchor="middle" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Property configuration</text>

<rect x="40" y="136" width="190" height="42" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="135" y="157" dominant-baseline="central" text-anchor="middle" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Live PMS data</text>

<line x1="230" y1="45" x2="250" y2="45" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<polygon points="250,45 243,41 243,49" style="fill:rgb(137, 135, 129);"/>

<rect x="250" y="24" width="200" height="42" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="350" y="45" dominant-baseline="central" text-anchor="middle" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Translated at build time</text>

<line x1="230" y1="101" x2="240" y2="101" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<line x1="230" y1="157" x2="240" y2="157" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<line x1="240" y1="101" x2="240" y2="157" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<line x1="240" y1="129" x2="250" y2="129" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<polygon points="250,129 243,125 243,133" style="fill:rgb(137, 135, 129);"/>

<rect x="250" y="97" width="200" height="64" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<text x="350" y="117" text-anchor="middle" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Render-time translation</text>
<text x="350" y="133" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">once per string</text>
<text x="350" y="147" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">first render ~5s, warmed in QA</text>

<line x1="450" y1="129" x2="470" y2="129" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<polygon points="470,129 463,125 463,133" style="fill:rgb(137, 135, 129);"/>

<rect x="470" y="97" width="160" height="64" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<text x="550" y="117" text-anchor="middle" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Shared cache</text>
<text x="550" y="133" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">source + language +</text>
<text x="550" y="147" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">context</text>

<line x1="350" y1="66" x2="350" y2="80" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<line x1="350" y1="80" x2="460" y2="80" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<line x1="460" y1="80" x2="460" y2="190" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<line x1="550" y1="161" x2="550" y2="190" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<line x1="460" y1="190" x2="550" y2="190" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<line x1="505" y1="190" x2="505" y2="214" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<polygon points="505,214 501,207 509,207" style="fill:rgb(137, 135, 129);"/>

<rect x="415" y="214" width="180" height="44" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="505" y="236" dominant-baseline="central" text-anchor="middle" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Guest</text>

<line x1="40" y1="272" x2="600" y2="272" style="stroke:rgb(11,11,11);stroke-opacity:0.2;stroke-width:0.5px;"/>
<text x="40" y="290" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Correction loop — staff can flag a translation</text>

<rect x="470" y="298" width="160" height="42" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="550" y="319" dominant-baseline="central" text-anchor="middle" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Staff flag</text>

<line x1="630" y1="319" x2="655" y2="319" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<line x1="655" y1="319" x2="655" y2="129" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<line x1="655" y1="129" x2="630" y2="129" style="stroke:rgb(137, 135, 129);stroke-width:1px;"/>
<polygon points="630,129 637,125 637,133" style="fill:rgb(137, 135, 129);"/>
<text x="645" y="224" text-anchor="middle" transform="rotate(-90 645 224)" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:11px;">corrects the entry</text>
</svg>
