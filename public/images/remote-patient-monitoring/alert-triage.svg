<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Alert triage: rules decide what is dangerous, a model orders and summarises, the doctor decides</title>
<style>.t{font:600 12.5px Archivo,"Helvetica Neue",Arial,sans-serif;fill:#1c1a17}.s{font:10.5px Archivo,"Helvetica Neue",Arial,sans-serif;fill:#6b665d}.m{font:10.5px "JetBrains Mono",ui-monospace,Menlo,monospace;fill:#6b665d}.c{font:12px Archivo,"Helvetica Neue",Arial,sans-serif;fill:#1c1a17}.a{stroke:#6b665d;stroke-width:1.5;fill:none}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b665d"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="299" rx="4" fill="#fbf9f4" stroke="#ddd7cb"/>
<text class="m" x="20" y="30">alert triage</text>
<g stroke="#1c1a17" stroke-width="1.2" fill="#f6f3ec">
<rect x="20" y="62" width="112" height="104" rx="4"/>
<rect x="152" y="62" width="112" height="104" rx="4"/>
<rect x="284" y="62" width="112" height="104" rx="4"/>
<rect x="416" y="62" width="112" height="104" rx="4" fill="#f0ebe0" stroke="#6b665d" stroke-dasharray="5 3"/>
<rect x="548" y="62" width="112" height="104" rx="4" stroke-width="2.2"/>
</g>
<g text-anchor="middle">
<text class="t" x="76" y="88">Devices</text><text class="s" x="76" y="108">daily readings</text><text class="s" x="76" y="122">from patients</text><text class="s" x="76" y="136">at home</text>
<text class="t" x="208" y="88">Rules</text><text class="s" x="208" y="108">defined with</text><text class="s" x="208" y="122">doctors; decides</text><text class="s" x="208" y="136">what is dangerous</text>
<text class="t" x="340" y="88">Flagged alerts</text><text class="s" x="340" y="108">a reading over a</text><text class="s" x="340" y="122">set threshold or</text><text class="s" x="340" y="136">rising too fast</text>
<text class="t" x="472" y="88">LLM layer</text><text class="s" x="472" y="108">orders by priority</text><text class="s" x="472" y="122">highlights values</text><text class="s" x="472" y="136">writes a summary</text>
<text class="t" x="604" y="88">Doctor</text><text class="s" x="604" y="108">reads the summary</text><text class="s" x="604" y="122">and decides</text>
</g>
<g class="a" marker-end="url(#arr)">
<line x1="134" y1="114" x2="150" y2="114" marker-end="url(#arr)"/>
<line x1="266" y1="114" x2="282" y2="114" marker-end="url(#arr)"/>
<line x1="398" y1="114" x2="414" y2="114" marker-end="url(#arr)"/>
<line x1="530" y1="114" x2="546" y2="114" marker-end="url(#arr)"/>
</g>
<g class="a">
<path d="M152,178 V186 H396 V178"/><path d="M416,178 V186 H528 V178"/><path d="M548,178 V186 H660 V178"/>
</g>
<g text-anchor="middle">
<text class="m" x="274" y="204">deterministic · auditable</text><text class="m" x="274" y="218">non-negotiable</text>
<text class="m" x="472" y="204">assists only:</text><text class="m" x="472" y="218">never decides what</text><text class="m" x="472" y="232">is dangerous</text>
<text class="m" x="604" y="204">the decision stays</text><text class="m" x="604" y="218">human</text>
<text class="c" x="340" y="274">Rules decide what is dangerous. The model orders and summarises. The doctor decides.</text>
</g>
</svg>
