<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Share of correct answers on a 21-case evaluation across six configurations. The history is not monotonic: a cheaper generation model caused a regression that a prompt change recovered.</title>
<style>.t{font:600 12.5px Archivo,"Helvetica Neue",Arial,sans-serif;fill:#1c1a17}.s{font:10.5px Archivo,"Helvetica Neue",Arial,sans-serif;fill:#6b665d}.m{font:10.5px "JetBrains Mono",ui-monospace,Menlo,monospace;fill:#6b665d}.c{font:12px Archivo,"Helvetica Neue",Arial,sans-serif;fill:#1c1a17}</style>
<rect x="0.5" y="0.5" width="679" height="299" rx="4" fill="#fbf9f4" stroke="#ddd7cb"/>
<text class="m" x="20" y="28">correct answers on 21 cases · judged by a separate model</text>
<line x1="60" y1="62.0" x2="660" y2="62.0" stroke="#ddd7cb"/>
<text class="m" x="50" y="65.5" text-anchor="end">100%</text>
<line x1="60" y1="126.0" x2="660" y2="126.0" stroke="#ddd7cb" stroke-dasharray="3 3"/>
<text class="m" x="50" y="129.5" text-anchor="end">90%</text>
<line x1="60" y1="190.0" x2="660" y2="190.0" stroke="#ddd7cb" stroke-dasharray="3 3"/>
<text class="m" x="50" y="193.5" text-anchor="end">80%</text>
<polyline points="70,153.5 178,153.5 286,62.0 394,62.0 502,92.7 610,62.0" fill="none" stroke="#1c1a17" stroke-width="1.8" stroke-linejoin="round"/>
<circle cx="70" cy="153.5" r="4" fill="#fbf9f4" stroke="#1c1a17" stroke-width="1.8"/>
<text class="t" x="70" y="142.5" text-anchor="middle" style="fill:#1c1a17">85.7%</text>
<text class="m" x="70" y="214" text-anchor="middle">baseline</text>

<circle cx="178" cy="153.5" r="4" fill="#fbf9f4" stroke="#1c1a17" stroke-width="1.8"/>
<text class="t" x="178" y="142.5" text-anchor="middle" style="fill:#1c1a17">85.7%</text>
<text class="m" x="178" y="214" text-anchor="middle">v1</text>
<text class="s" x="178" y="230" text-anchor="middle">tables kept</text>
<text class="s" x="178" y="244" text-anchor="middle">with their intro</text>
<circle cx="286" cy="62.0" r="4" fill="#fbf9f4" stroke="#1c1a17" stroke-width="1.8"/>
<text class="t" x="286" y="51.0" text-anchor="middle" style="fill:#1c1a17">100%</text>
<text class="m" x="286" y="214" text-anchor="middle">v2</text>
<text class="s" x="286" y="230" text-anchor="middle">retrieval K</text>
<text class="s" x="286" y="244" text-anchor="middle">6 → 10</text>
<circle cx="394" cy="62.0" r="4" fill="#fbf9f4" stroke="#1c1a17" stroke-width="1.8"/>
<text class="t" x="394" y="51.0" text-anchor="middle" style="fill:#1c1a17">100%</text>
<text class="m" x="394" y="214" text-anchor="middle">v3</text>
<text class="s" x="394" y="230" text-anchor="middle">same config,</text>
<text class="s" x="394" y="244" text-anchor="middle">re-measured</text>
<circle cx="502" cy="92.7" r="5" fill="#6b1f3f" stroke="#6b1f3f" stroke-width="1.8"/>
<text class="t" x="502" y="81.7" text-anchor="middle" style="fill:#6b1f3f">95.2%</text>
<text class="m" x="502" y="214" text-anchor="middle">v4</text>
<text class="s" x="502" y="230" text-anchor="middle">cheaper</text>
<text class="s" x="502" y="244" text-anchor="middle">generation model</text>
<circle cx="610" cy="62.0" r="4" fill="#fbf9f4" stroke="#1c1a17" stroke-width="1.8"/>
<text class="t" x="610" y="51.0" text-anchor="middle" style="fill:#1c1a17">100%</text>
<text class="m" x="610" y="214" text-anchor="middle">v5</text>
<text class="s" x="610" y="230" text-anchor="middle">completeness</text>
<text class="s" x="610" y="244" text-anchor="middle">rules in prompt</text>
<text class="c" x="340" y="282" text-anchor="middle">Not monotonic: the harness caught a regression, then the change that recovered it.</text>
</svg>