<rect x="394" y="128" width="60" height="26" rx="4" style="fill:rgb(252, 235, 235);stroke:rgb(163, 45, 45);stroke-width:0.5px;"/>
<rect x="470" y="128" width="60" height="26" rx="4" style="fill:rgb(252, 235, 235);stroke:rgb(163, 45, 45);stroke-width:0.5px;"/>
<rect x="546" y="128" width="60" height="26" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>

<text x="40" y="184" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Self-hosted AI</text>
<rect x="166" y="172" width="60" height="26" rx="4" style="fill:rgb(252, 235, 235);stroke:rgb(163, 45, 45);stroke-width:0.5px;"/>
<rect x="242" y="172" width="60" height="26" rx="4" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5px;"/>
