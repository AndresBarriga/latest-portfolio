<rect x="470" y="172" width="60" height="26" rx="4" style="fill:rgb(252, 235, 235);stroke:rgb(163, 45, 45);stroke-width:0.5px;"/>
<rect x="546" y="172" width="60" height="26" rx="4" style="fill:rgb(252, 235, 235);stroke:rgb(163, 45, 45);stroke-width:0.5px;"/>

<text x="40" y="228" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Build in-house</text>
<rect x="166" y="216" width="60" height="26" rx="4" style="fill:rgb(252, 235, 235);stroke:rgb(163, 45, 45);stroke-width:0.5px;"/>
<rect x="242" y="216" width="60" height="26" rx="4" style="fill:rgb(252, 235, 235);stroke:rgb(163, 45, 45);stroke-width:0.5px;"/>
<rect x="318" y="216" width="60" height="26" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<rect x="394" y="216" width="60" height="26" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<rect x="470" y="216" width="60" height="26" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<rect x="546" y="216" width="60" height="26" rx="4" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5px;"/>

<line x1="40" y1="266" x2="640" y2="266" style="stroke:rgb(11,11,11);stroke-opacity:0.2;stroke-width:0.5px;"/>

<text x="40" y="292" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Then the commercial check — vendor scan cost as a share of licence revenue per room</text>

<line x1="440" y1="330" x2="440" y2="462" style="stroke:rgb(137, 135, 129);stroke-width:0.5px;stroke-dasharray:3,3;"/>

<rect x="240" y="340" width="200" height="26" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="40" y="353" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Licence revenue</text>
<text x="450" y="353" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">100%</text>

<rect x="240" y="382" width="142" height="26" rx="4" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5px;"/>
<text x="40" y="395" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">8 scans / room / month</text>
<text x="392" y="395" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">71%</text>

<rect x="240" y="424" width="356" height="26" rx="4" style="fill:rgb(252, 235, 235);stroke:rgb(163, 45, 45);stroke-width:0.5px;"/>
<text x="40" y="437" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">20 scans / room / month</text>
<text x="606" y="437" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">178%</text>
</svg>
