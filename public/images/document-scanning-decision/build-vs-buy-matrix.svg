<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Build versus buy evaluation matrix with cost constraint</title>
<desc>Four options scored across six criteria. Buying a vendor SDK scored best on delivery speed, coverage and privacy, and was the recommended and approved option. A separate cost check showed vendor per-scan pricing reaching 71 percent of licence revenue per room at conservative volumes and 178 percent at realistic volumes, which invalidated it. Building MRZ-only scored well on cost, privacy and determinism, and was the option shipped.</desc>

<text x="40" y="30" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Spike evaluation — four options, six criteria</text>

<text x="196" y="58" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Delivery</text>
<text x="272" y="58" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Coverage</text>
<text x="348" y="58" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Unit cost</text>
<text x="424" y="58" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Privacy</text>
<text x="500" y="58" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Determ.</text>
<text x="576" y="58" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Ops load</text>

<text x="40" y="88" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Vendor SDK</text>
<text x="40" y="104" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">recommended</text>
<rect x="166" y="76" width="60" height="26" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<rect x="242" y="76" width="60" height="26" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<rect x="318" y="76" width="60" height="26" rx="4" style="fill:rgb(252, 235, 235);stroke:rgb(163, 45, 45);stroke-width:0.5px;"/>
<rect x="394" y="76" width="60" height="26" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<rect x="470" y="76" width="60" height="26" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<rect x="546" y="76" width="60" height="26" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>

<text x="40" y="140" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">External AI</text>
<rect x="166" y="128" width="60" height="26" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<rect x="242" y="128" width="60" height="26" rx="4" style="fill:rgb(250, 238, 218);stroke:rgb(133, 79, 11);stroke-width:0.5px;"/>
