<svg width="100%" viewBox="0 0 680 402" role="img" xmlns="http://www.w3.org/2000/svg">
<title>AI Information Guide architecture</title>
<desc>Guests enter by QR without login, staff by SSO. The AI Information Guide answers generic questions from a document store and invokes operations on connected products, which execute against the customer's Opera Cloud and Simphony POS. The model never writes to a customer system directly.</desc>

<rect x="120" y="28" width="170" height="42" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="205" y="45" text-anchor="middle" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Guest</text>
<text x="205" y="60" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">QR, no login</text>

<rect x="390" y="28" width="170" height="42" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="475" y="45" text-anchor="middle" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Staff / admin</text>
<text x="475" y="60" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">SSO login</text>

