<polygon points="340,110 336,103 344,103" style="fill:rgb(137, 135, 129);"/>

<rect x="40" y="112" width="160" height="46" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="120" y="131" text-anchor="middle" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Document store</text>
<text x="120" y="146" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">hotel PDFs, site content</text>

