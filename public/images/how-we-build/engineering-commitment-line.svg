<svg width="100%" viewBox="0 0 680 1036" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Prototype-first delivery process</title>
<desc>Discovery, owned by the PM: idea, clickable prototype, internal review, customer demos looping back, then a PRD describing what survived. Handover call is where engineering commits. Delivery, owned by engineering: TRD with agent assistance, stories implemented by agents, code review with agent pre-checks and developer ownership, customer demos again that can loop back, then pilot and rollout. Filled teal marks steps agents do; teal outline marks steps agents assist.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="20" width="600" height="444" rx="12" fill="none" style="stroke:rgba(11,11,11,0.2);stroke-width:0.5px;stroke-dasharray:4px,4px;"/>
<text x="60" y="44" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Discovery — the PM owns it</text>
<text x="60" y="62" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Being wrong costs an afternoon</text>

<rect x="190" y="80" width="300" height="44" rx="8" style="fill:rgb(252, 252, 251);stroke:rgba(11,11,11,0.2);stroke-width:0.5px;"/>
<text x="340" y="102" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Idea — a hypothesis, not a requirement</text>

<line x1="340" y1="124" x2="340" y2="146" marker-end="url(#arrow)" style="stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>

<rect x="190" y="148" width="300" height="56" rx="8" style="fill:rgb(252, 252, 251);stroke:rgba(11,11,11,0.2);stroke-width:0.5px;"/>
<text x="340" y="167" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Clickable prototype</text>
<text x="340" y="186" text-anchor="middle" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Built by the PM in low-code</text>

<line x1="340" y1="204" x2="340" y2="226" marker-end="url(#arrow)" style="stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>

<rect x="190" y="228" width="300" height="56" rx="8" style="fill:rgb(252, 252, 251);stroke:rgba(11,11,11,0.2);stroke-width:0.5px;"/>
<text x="340" y="247" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Internal review</text>
<text x="340" y="266" text-anchor="middle" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Design and engineering react early</text>

<line x1="340" y1="284" x2="340" y2="306" marker-end="url(#arrow)" style="stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>

<rect x="190" y="308" width="300" height="56" rx="8" style="fill:rgb(252, 252, 251);stroke:rgba(11,11,11,0.2);stroke-width:0.5px;"/>
<text x="340" y="327" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Customer demos</text>
<text x="340" y="346" text-anchor="middle" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Would they use it? Most ideas die</text>

<path d="M190 336 L140 336 L140 176 L186 176" fill="none" marker-end="url(#arrow)" style="stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>
<text x="132" y="256" text-anchor="end" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">kill or rework</text>

<line x1="340" y1="364" x2="340" y2="386" marker-end="url(#arrow)" style="stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>

<rect x="190" y="388" width="300" height="56" rx="8" style="fill:rgb(252, 252, 251);stroke:rgba(11,11,11,0.2);stroke-width:0.5px;"/>
<text x="340" y="407" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">PRD</text>
<text x="340" y="426" text-anchor="middle" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Describes only what survived</text>

<line x1="340" y1="444" x2="340" y2="482" marker-end="url(#arrow)" style="stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>

<rect x="160" y="484" width="360" height="56" rx="8" style="fill:rgb(252, 252, 251);stroke:rgba(11,11,11,0.2);stroke-width:1.5px;"/>
<text x="340" y="503" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Handover call — engineering commits</text>
<text x="340" y="522" text-anchor="middle" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Developers use it before reading the spec</text>

<line x1="340" y1="540" x2="340" y2="618" marker-end="url(#arrow)" style="stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>

<rect x="40" y="560" width="600" height="456" rx="12" fill="none" style="stroke:rgba(11,11,11,0.2);stroke-width:0.5px;stroke-dasharray:4px,4px;"/>
<text x="60" y="584" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Delivery — engineering owns it</text>
<text x="60" y="602" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Being wrong costs weeks</text>

<rect x="380" y="577" width="14" height="14" rx="3" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<text x="400" y="584" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">agent does it</text>
<rect x="510" y="577" width="14" height="14" rx="3" fill="none" style="stroke:rgb(29, 158, 117);stroke-width:1.5px;"/>
<text x="530" y="584" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">agent assists</text>

<rect x="190" y="620" width="300" height="56" rx="8" fill="none" style="stroke:rgb(29, 158, 117);stroke-width:1.5px;"/>
<text x="340" y="639" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">TRD + implementation plan</text>
<text x="340" y="658" text-anchor="middle" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Developers write; agent flags PRD gaps</text>

<line x1="340" y1="676" x2="340" y2="698" marker-end="url(#arrow)" style="stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>

<rect x="190" y="700" width="300" height="56" rx="8" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<text x="340" y="719" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Agents implement the stories</text>
<text x="340" y="738" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Status reported on each ticket</text>

<line x1="340" y1="756" x2="340" y2="778" marker-end="url(#arrow)" style="stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>

<rect x="190" y="780" width="300" height="56" rx="8" fill="none" style="stroke:rgb(29, 158, 117);stroke-width:1.5px;"/>
<text x="340" y="799" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Code review</text>
<text x="340" y="818" text-anchor="middle" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Agent pre-checks; a developer owns it</text>

<line x1="340" y1="836" x2="340" y2="858" marker-end="url(#arrow)" style="stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>

<rect x="190" y="860" width="300" height="56" rx="8" style="fill:rgb(252, 252, 251);stroke:rgba(11,11,11,0.2);stroke-width:0.5px;"/>
<text x="340" y="879" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Customer demos again</text>
<text x="340" y="898" text-anchor="middle" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Validation never closes</text>

<path d="M190 888 L140 888 L140 728 L186 728" fill="none" marker-end="url(#arrow)" style="stroke:rgb(137, 135, 129);stroke-width:1.5px;stroke-dasharray:4px,3px;"/>
<text x="132" y="808" text-anchor="end" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">adjust</text>

<line x1="340" y1="916" x2="340" y2="938" marker-end="url(#arrow)" style="stroke:rgb(137, 135, 129);stroke-width:1.5px;"/>

<rect x="190" y="940" width="300" height="56" rx="8" style="fill:rgb(252, 252, 251);stroke:rgba(11,11,11,0.2);stroke-width:0.5px;"/>
<text x="340" y="959" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Pilot, then production</text>
<text x="340" y="978" text-anchor="middle" dominant-baseline="central" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Real usage before full rollout</text>
</svg>
