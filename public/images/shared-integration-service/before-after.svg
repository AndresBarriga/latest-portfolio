<svg width="100%" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Before and after: integrating a shared PMS once per property instead of once per product</title>
<desc>Before: five products each connect separately to the hotel's PMS, each with its own cache and refresh policy, repeated for every property. After: one replication service per PMS instance subscribes to the PMS's Business Events and replicates reservations and profiles; all five products read from it, so each property is integrated once.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" style="fill:rgb(95, 94, 90);"/>
  </marker>
</defs>

<text x="20" y="20" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">One PMS connection per property, shared across products</text>

<text x="20" y="44" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Before</text>
<text x="360" y="44" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">After</text>

<line x1="340" y1="40" x2="340" y2="378" style="stroke:rgb(137, 135, 129);stroke-width:0.5px;stroke-dasharray:3,3;"/>

<!-- BEFORE: five products, each with its own cache, each with its own line to a shared PMS box -->

<rect x="20" y="63" width="100" height="22" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="70" y="74" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Product 1</text>
<text x="70" y="96" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:9.5px;">own cache</text>

<rect x="20" y="105" width="100" height="22" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="70" y="116" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Product 2</text>
<text x="70" y="138" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:9.5px;">own cache</text>

<rect x="20" y="147" width="100" height="22" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="70" y="158" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Product 3</text>
<text x="70" y="180" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:9.5px;">own cache</text>

<rect x="20" y="189" width="100" height="22" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="70" y="200" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Product 4</text>
<text x="70" y="222" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:9.5px;">own cache</text>

<rect x="20" y="231" width="100" height="22" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="70" y="242" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Product 5</text>
<text x="70" y="264" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:9.5px;">own cache</text>

<line x1="120" y1="74" x2="248" y2="158" style="stroke:rgb(95, 94, 90);stroke-width:0.5px;" marker-end="url(#arrow)"/>
<line x1="120" y1="116" x2="248" y2="158" style="stroke:rgb(95, 94, 90);stroke-width:0.5px;" marker-end="url(#arrow)"/>
<line x1="120" y1="158" x2="248" y2="158" style="stroke:rgb(95, 94, 90);stroke-width:0.5px;" marker-end="url(#arrow)"/>
<line x1="120" y1="200" x2="248" y2="158" style="stroke:rgb(95, 94, 90);stroke-width:0.5px;" marker-end="url(#arrow)"/>
<line x1="120" y1="242" x2="248" y2="158" style="stroke:rgb(95, 94, 90);stroke-width:0.5px;" marker-end="url(#arrow)"/>

<rect x="250" y="133" width="60" height="50" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<text x="280" y="158" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">PMS</text>

<text x="20" y="400" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">repeated for every property</text>

<!-- AFTER: PMS, through Business Events, into a replication service that all five products read from -->

<rect x="458" y="63" width="70" height="26" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<text x="493" y="76" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">PMS</text>

<line x1="493" y1="89" x2="493" y2="100" style="stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="493" y="112" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:11px;">Business Events</text>
<line x1="493" y1="118" x2="493" y2="133" style="stroke:rgb(95, 94, 90);stroke-width:0.5px;" marker-end="url(#arrow)"/>

<rect x="415" y="133" width="155" height="50" rx="4" style="fill:rgb(225, 245, 238);stroke:rgb(15, 110, 86);stroke-width:0.5px;"/>
<text x="492" y="158" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:11.5px;font-weight:500;">Replication service</text>
<text x="492" y="196" text-anchor="middle" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:9px;">queue · reconciliation · resync</text>

<line x1="570" y1="158" x2="578" y2="74" style="stroke:rgb(95, 94, 90);stroke-width:0.5px;" marker-end="url(#arrow)"/>
<line x1="570" y1="158" x2="578" y2="116" style="stroke:rgb(95, 94, 90);stroke-width:0.5px;" marker-end="url(#arrow)"/>
<line x1="570" y1="158" x2="578" y2="158" style="stroke:rgb(95, 94, 90);stroke-width:0.5px;" marker-end="url(#arrow)"/>
<line x1="570" y1="158" x2="578" y2="200" style="stroke:rgb(95, 94, 90);stroke-width:0.5px;" marker-end="url(#arrow)"/>
<line x1="570" y1="158" x2="578" y2="242" style="stroke:rgb(95, 94, 90);stroke-width:0.5px;" marker-end="url(#arrow)"/>

<rect x="580" y="63" width="80" height="22" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="620" y="74" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Product 1</text>

<rect x="580" y="105" width="80" height="22" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="620" y="116" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Product 2</text>

<rect x="580" y="147" width="80" height="22" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="620" y="158" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Product 3</text>

<rect x="580" y="189" width="80" height="22" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="620" y="200" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Product 4</text>

<rect x="580" y="231" width="80" height="22" rx="4" style="fill:rgb(241, 239, 232);stroke:rgb(95, 94, 90);stroke-width:0.5px;"/>
<text x="620" y="242" text-anchor="middle" dominant-baseline="central" style="fill:rgb(11, 11, 11);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Product 5</text>

<text x="360" y="400" style="fill:rgb(82, 81, 78);font-family:-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">integrated once per property</text>
</svg>
